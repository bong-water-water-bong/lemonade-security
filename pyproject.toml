[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lemonade-security"
version = "0.1.0"
description = "Local security policy checks, agent audits, AIBOM manifests, and privacy findings for Lemonade Store."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lemonade Security contributors" }]
keywords = ["security", "pos", "offline-first", "lemonade", "aibom"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "lemonade-agents @ git+https://github.com/bong-water-water-bong/lemonade-agents@main",
  "lemonade-store @ git+https://github.com/bong-water-water-bong/lemonade-store@main",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
lemonade-security = "lemonade_security.cli:main"

[project.urls]
Homepage = "https://github.com/bong-water-water-bong/lemonade-security"
Issues = "https://github.com/bong-water-water-bong/lemonade-security/issues"
Store = "https://github.com/bong-water-water-bong/lemonade-store"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lemonade_security = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "../lemonade-store/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:../lemonade-store/src"
packages = ["lemonade_security"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
